name: VsixPackage

# Builds the extension on every supported OS. Publishing to the Marketplace
# happens in release.yml when a GitHub release is published.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Extension
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Extension Dependencies
        # --ignore-scripts blocks dependency lifecycle scripts from running at
        # install time (supply-chain hardening). Safe here: all devDependencies
        # (incl. esbuild, whose platform binary ships as an optionalDependency)
        # work without install scripts.
        run: npm ci --ignore-scripts
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - name: Run Tests
        # The test scripts use POSIX shell commands, so they run on Linux only.
        if: matrix.os == 'ubuntu-latest'
        run: npm test
      - name: Build Extension
        run: npm run esbuild
