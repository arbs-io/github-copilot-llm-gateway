name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds, settings you've tried, or how other tools handle it.
  - type: input
    id: server
    attributes:
      label: Inference server and model
      description: If this is specific to a server or model, which one?
      placeholder: "vLLM with Qwen3-8B"
